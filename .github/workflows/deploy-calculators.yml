# Deploys sites/calculators (calculators.themethodco.co, the Instant Pricing
# Tool) to its own Cloudflare Pages project when that folder changes on main.
# Uses the same CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets as the
# main site, and skips the deploy until both exist.
name: Deploy Instant Pricing Tool

on:
  push:
    branches: [main]
    paths: ["sites/calculators/**"]
  workflow_dispatch:

concurrency:
  group: calculators-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy
        if: env.HAS_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.20.0 pages deploy sites/calculators --project-name method-calculators --branch main --commit-hash "${{ github.sha }}"
      - name: Explain the skipped deploy
        if: env.HAS_TOKEN != 'true'
        run: echo "::warning::Deploy skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets."
