# Builds the site and deploys it to the Cloudflare Pages project behind
# themethodco.co, Functions included.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   a token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  af175164c646167744368bafa1b07088
# Until both exist the job skips the deploy instead of failing.
#
# Stripe keys are not needed here. The Functions read STRIPE_SECRET_KEY,
# STRIPE_PRICE_ID and BASE_URL from the Pages project's own settings.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: "Pages branch. main deploys production; any other name makes a preview."
        default: main
        required: true

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Deploy
        if: env.HAS_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx wrangler pages deploy dist/public
          --project-name method-portfolio-preview
          --branch "${{ inputs.branch || 'main' }}"
          --commit-hash "${{ github.sha }}"

      - name: Explain the skipped deploy
        if: env.HAS_TOKEN != 'true'
        run: echo "::warning::Deploy skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets."
