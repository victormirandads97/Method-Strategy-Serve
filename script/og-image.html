<!doctype html>
<!--
  Source for client/public/og-image.png, the 1200x630 social share image.
  Brand tokens are the ones in client/src/lib/brand.ts; the logo is
  brand/logo/method-logo-horizontal-on-dark.svg. Regenerate with:

    node script/render-og-image.mjs
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OG image</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Bebas+Neue&family=JetBrains+Mono:wght@500;600&display=block" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(ellipse 60% 70% at 88% 12%, rgba(34, 216, 122, 0.16) 0%, transparent 60%),
      radial-gradient(ellipse 55% 65% at 8% 100%, rgba(15, 138, 84, 0.20) 0%, transparent 62%),
      linear-gradient(135deg, #111827 0%, #0A0F14 70%);
    color: #F9FAFB;
    font-family: 'Inter', system-ui, sans-serif;
  }
  /* The same hairline grid the site's case studies sit on, kept faint. */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(34, 216, 122, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(34, 216, 122, 0.05) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: linear-gradient(180deg, transparent 0%, #000 30%, #000 70%, transparent 100%);
  }
  .frame {
    position: absolute; inset: 64px 80px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand img { height: 64px; width: auto; display: block; }
  .label {
    font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 20px;
    letter-spacing: 0.22em; text-transform: uppercase; color: #22D87A; margin-bottom: 14px;
  }
  h1 {
    font-family: 'Bebas Neue', sans-serif; font-weight: 400;
    font-size: 132px; line-height: 0.9; letter-spacing: 0.01em; color: #F9FAFB;
  }
  .line {
    margin-top: 22px; font-weight: 300; font-size: 36px; line-height: 1.25; color: #D1D5DB;
  }
  .line em { font-style: normal; color: #22D87A; font-weight: 400; }
  .foot { display: flex; align-items: flex-end; justify-content: space-between; }
  .stack {
    font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 22px;
    color: #F9FAFB; letter-spacing: 0.02em;
  }
  .stack i { font-style: normal; color: #22D87A; padding: 0 0.35em; }
  .url {
    font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 22px; color: #9CA3AF;
  }
  .rule {
    position: absolute; left: 80px; right: 80px; bottom: 124px; height: 1px;
    background: linear-gradient(90deg, rgba(34, 216, 122,0.5), rgba(34, 216, 122,0.15) 70%, transparent);
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="rule"></div>
  <div class="frame">
    <div class="brand">
      <img src="../brand/logo/method-logo-horizontal-on-dark.svg" alt="" />
    </div>

    <div>
      <p class="label">AI Product Builder</p>
      <h1>Victor Miranda</h1>
      <p class="line">I turn ideas into <em>working products.</em></p>
    </div>

    <div class="foot">
      <p class="stack">React<i>·</i>TypeScript<i>·</i>Node<i>·</i>AI</p>
      <p class="url">themethodco.co</p>
    </div>
  </div>
</body>
</html>
